name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Node.js 24 package checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
